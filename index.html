<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RiceFlow Enterprise - Integrated Rice System</title>
    
    <!-- Library Utama -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
      // Inisialisasi Environment
      window.process = { env: { NODE_ENV: 'production', API_KEY: '' } };
      
      // Deteksi Error
      window.onerror = function(msg, url, line) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="padding: 40px; font-family: sans-serif; text-align: center;">
              <h3 style="color: #e11d48; font-weight: bold;">⚠️ Gagal Memuat Sistem</h3>
              <p style="color: #64748b; font-size: 14px; margin-top: 10px;">Terjadi kesalahan pada script browser.</p>
              <div style="background: #f1f5f9; padding: 10px; border-radius: 6px; margin: 20px auto; max-width: 500px; font-size: 11px; text-align: left; font-family: monospace; border: 1px solid #cbd5e1;">
                ${msg}
              </div>
              <button onclick="window.location.reload()" style="background: #1e293b; color: white; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer;">Muat Ulang Halaman</button>
            </div>
          `;
        }
      };
    </script>

    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
      .loader { border: 3px solid #f3f3f3; border-top: 3px solid #10b981; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .animate-fade-in { animation: fadeIn 0.3s ease-out; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>

    <!-- Import Map Bersih (Hanya React 18) -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "lucide-react": "https://esm.sh/lucide-react@0.474.0?deps=react@18.2.0",
    "recharts": "https://esm.sh/recharts@2.12.7?deps=react@18.2.0",
    "react-markdown": "https://esm.sh/react-markdown@8.0.7?deps=react@18.2.0",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root">
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #94a3b8;">
            <div class="loader"></div>
            <p style="font-weight: 500;">Menyiapkan RiceFlow Enterprise...</p>
        </div>
    </div>

    <!-- PENTING: Menambahkan data-type="module" agar browser mengenali hasil transpile Babel -->
    <script type="text/babel" data-type="module" data-presets="react,typescript" src="./index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
